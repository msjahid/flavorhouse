services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flavorhouse
      POSTGRES_USER: flavorhouse
      POSTGRES_PASSWORD: flavorhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flavorhouse"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://flavorhouse:flavorhouse@db:5432/flavorhouse
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      INTERNAL_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
